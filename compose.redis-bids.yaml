services:
  bid-ledger:
    image: redis:7.4
    command: [redis-server, --appendonly, "yes", --appendfsync, always, --maxmemory, 256mb, --maxmemory-policy, noeviction]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - bid-ledger-data:/data
    restart: unless-stopped

volumes:
  bid-ledger-data:
